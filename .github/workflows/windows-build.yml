name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - windows-installer-persistent-settings

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails 3
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Windows executable
        run: wails3 task build

      - name: Build Windows NSIS installer
        run: wails3 task package FORMAT=nsis

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item bin\ghost-chat.exe dist\ghost-chat.exe -Force
          $installer = Get-ChildItem bin\ghost-chat-*-installer.exe | Select-Object -First 1
          if (-not $installer) {
            throw 'NSIS installer was not created.'
          }
          Copy-Item $installer.FullName dist\ghost-chat-Setup.exe -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: GhostChat-Windows-Installer
          path: dist/
          if-no-files-found: error
