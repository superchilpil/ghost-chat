name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. v4.0.1) — leave empty to auto-detect from commits"
        required: false
      release-candidate:
        description: "Draft a release candidate (vX.Y.Z-rc.N, marked as prerelease)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

jobs:
  determine-version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute release version
        id: version
        env:
          RC: ${{ inputs.release-candidate }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          args=()

          if [ "$RC" = "true" ]; then
            args+=(--rc)
          fi

          if [ -n "$OVERRIDE" ]; then
            args+=(--override "$OVERRIDE")
          fi

          version="$(bash .github/scripts/next-version.sh "${args[@]}")"

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "tag $version already exists" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: `$version`" >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    needs: determine-version
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: wails3 task darwin:package:universal
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Zip app bundle
        run: cd bin && zip -r ghost-chat-macos.zip ghost-chat.app

      - uses: actions/upload-artifact@v7
        with:
          name: ghost-chat-macos
          path: bin/ghost-chat-macos.zip

  build-windows:
    needs: determine-version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build Windows application
        run: wails3 task build
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          $env:PATH = "C:\\Program Files (x86)\\NSIS;" + $env:PATH
          Add-Content -Path $env:GITHUB_PATH -Value "C:\\Program Files (x86)\\NSIS"

      - name: Build Windows NSIS installer
        run: wails3 task package FORMAT=nsis
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Prepare Windows release assets
        shell: bash
        run: |
          VERSION="${VERSION_TAG#v}"
          mv "bin/ghost-chat-amd64-installer.exe" "bin/ghost-chat-Setup-${VERSION}.exe"
        env:
          VERSION_TAG: ${{ needs.determine-version.outputs.version }}

      - name: Verify Windows release assets
        shell: powershell
        run: |
          if (-not (Test-Path 'bin/ghost-chat.exe')) { throw 'Missing portable ghost-chat.exe' }
          $installer = Get-ChildItem 'bin/ghost-chat-Setup-*.exe' -File
          if (-not $installer) { throw 'Missing Windows NSIS installer' }
          Write-Host "Installer: $($installer.FullName)"

      - uses: actions/upload-artifact@v7
        with:
          name: ghost-chat-windows
          path: |
            bin/ghost-chat.exe
            bin/ghost-chat-Setup-*.exe

  create-release:
    needs: [determine-version, build-macos, build-windows]
    runs-on: ubuntu-latest

    env:
      VERSION_TAG: ${{ needs.determine-version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate updater manifests
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${VERSION_TAG#v}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          INSTALLER="ghost-chat-Setup-${VERSION}.exe"

          echo "Downloaded release artifacts:"
          find artifacts -maxdepth 3 -type f -print

          INSTALLER_PATH="$(find artifacts -type f -name "${INSTALLER}" -print -quit)"
          if [ -z "${INSTALLER_PATH}" ]; then
            echo "ERROR: Could not find ${INSTALLER} in downloaded artifacts." >&2
            exit 1
          fi
          if [ "${INSTALLER_PATH}" != "artifacts/${INSTALLER}" ]; then
            mv "${INSTALLER_PATH}" "artifacts/${INSTALLER}"
          fi

          PORTABLE_PATH="$(find artifacts -type f -name "ghost-chat.exe" -print -quit)"
          if [ -n "${PORTABLE_PATH}" ] && [ "${PORTABLE_PATH}" != "artifacts/ghost-chat.exe" ]; then
            mv "${PORTABLE_PATH}" "artifacts/ghost-chat.exe"
          fi

          MAC_PATH="$(find artifacts -type f -name "ghost-chat-macos.zip" -print -quit)"
          if [ -n "${MAC_PATH}" ] && [ "${MAC_PATH}" != "artifacts/ghost-chat-macos.zip" ]; then
            mv "${MAC_PATH}" "artifacts/ghost-chat-macos.zip"
          fi

          INSTALLER_SHA512="$(sha512sum "artifacts/${INSTALLER}" | awk '{print $1}')"
          INSTALLER_SIZE="$(stat -c%s "artifacts/${INSTALLER}")"

          cat > artifacts/latest.yml <<EOF
          version: ${VERSION}
          files:
            - url: ${INSTALLER}
              sha512: ${INSTALLER_SHA512}
              size: ${INSTALLER_SIZE}
          path: ${INSTALLER}
          sha512: ${INSTALLER_SHA512}
          releaseDate: '${DATE}'
          EOF

          DUMMY_SHA="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          cat > artifacts/latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: ghost-chat-${VERSION}.dmg
              sha512: ${DUMMY_SHA}
              size: 1
          path: ghost-chat-${VERSION}.dmg
          sha512: ${DUMMY_SHA}
          releaseDate: '${DATE}'
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          draft: ${{ inputs.release-candidate }}
          prerelease: ${{ inputs.release-candidate }}
          generate_release_notes: true
          append_body: true
          body: |
            # Ghost Chat v1.0.0 — Full Release

            **This is the full v1.0.0 release of this Ghost Chat fork. It is not a release candidate.**

            This release marks the first full release of the fork's new automatic live-stream workflow and Windows-focused distribution improvements.

            ## Changelog

            ### Automatic live-stream workflow
            - Automatic live detection for configured Twitch, YouTube, and Kick channels.
            - Automatic chat connection when a configured stream goes live.
            - Automatically brings Ghost Chat to the front and switches to the chat view.
            - Automatically enables vanish/click-through mode when live.
            - Automatically disconnects when the stream ends.
            - Automatically returns Ghost Chat to the system tray after the stream ends.
            - Per-platform Auto Connect controls.
            - Channel changes require Auto Connect confirmation before monitoring resumes.
            - Configurable live detection interval: 5 seconds through 5 minutes.
            - Background monitoring continues while Ghost Chat is hidden in the tray.

            ### YouTube improvements
            - Low-latency Live Chat StreamList transport with Innertube fallback.
            - StreamList message deduplication.
            - Chronological chat message ordering.
            - Connection diagnostics showing the active chat transport.
            - Release builds can embed the YouTube API configuration.

            ### Original project credit
- Ghost Chat was originally created by **Enubia**. This release is a fork and continuation of the original project.
- Original repository: https://github.com/Enubia/ghost-chat

### Windows experience
            - Windows system tray integration.
            - Prebuilt Windows portable executable.
            - Windows NSIS installer.
            - Persistent configuration across launches and reinstalls.
            - Automated Windows build and release packaging.
            - Built-in update checking/release manifest support.

            ### Automatic updater
            - Installed Windows versions can download the new NSIS installer directly from the GitHub release.
            - Ghost Chat closes itself after launching the installer so the update can replace the running application.
            - Portable/standalone Windows builds continue to open the GitHub Releases/downloads page instead of downloading an installer.
            - macOS continues to use the GitHub release/download page while macOS updater behavior remains untested.

            ### Documentation
            - Updated README with fork-specific features.
            - Added Windows installation instructions.
            - Documented the YouTube API key requirement for users building their own copy.

            ## Downloads

            - **Windows installer:** [ghost-chat Setup](https://github.com/superchilpil/ghost-chat/releases/latest/download/ghost-chat-Setup-${VERSION_TAG#v}.exe)
            - **Windows portable:** [ghost-chat.exe](https://github.com/superchilpil/ghost-chat/releases/latest/download/ghost-chat.exe)
            - **Mac:** [ghost-chat-macos.zip](https://github.com/superchilpil/ghost-chat/releases/latest/download/ghost-chat-macos.zip)

            ### Settings persistence

            Ghost Chat stores its configuration in the Windows user configuration directory rather than inside the application install directory. The installer/uninstaller therefore leaves the configuration intact, allowing a reinstall to retain your settings.

            ### Self-building

            Users who build Ghost Chat themselves must provide their own **YouTube Data API v3 key** through the `YOUTUBE_API_KEY` environment variable. The public prebuilt release includes the release API configuration, so normal users do not need to configure an API key.

            ### Installation / Usage / Bug reporting

            A detailed description is available on our [wiki](https://github.com/Enubia/ghost-chat/wiki).

            ---

          files: |
            artifacts/*
